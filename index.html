
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMBATE COLOMBIA V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101326;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:20px;background:linear-gradient(120deg,#172044,#5b183c)}
h1{font-size:clamp(25px,7vw,42px);color:#ffd43b;margin:5px;text-shadow:3px 3px #c22}
header p{color:#ddd;margin:8px}
button{border:0;border-radius:10px;padding:13px 17px;font-weight:bold;background:#ffd43b;color:#171717;cursor:pointer}
button:active{transform:scale(.95)}
.screen{padding:15px;max-width:850px;margin:auto}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fighter{background:#252b48;border:2px solid #444b70;border-radius:12px;padding:12px;cursor:pointer}
.fighter.selected{border-color:#ffd43b;background:#48402c}
.avatar{font-size:48px;display:block;margin:5px}
.fighter strong{display:block}
small{color:#ccc}
#arena{position:relative;overflow:hidden;border:3px solid #e2c16a;border-radius:12px;height:290px;background:linear-gradient(#72b8d6 0 55%,#b4a17b 55% 70%,#454b4d 70%);margin:12px auto}
#arena:before{content:"🏛️  🏛️  🏛️";position:absolute;top:65px;left:0;width:100%;font-size:53px;letter-spacing:4px}
#arena:after{content:"PLAZA DE BOLÍVAR • COLOMBIA";position:absolute;bottom:8px;left:0;width:100%;font-size:12px;color:white;font-weight:bold;text-shadow:1px 2px black}
.fighter-sprite{position:absolute;bottom:48px;font-size:76px;z-index:2;transition:transform .12s}
#playerSprite{left:15%}
#enemySprite{right:15%;transform:scaleX(-1)}
#playerSprite.hit{transform:translateX(25px) rotate(-12deg)}
#enemySprite.hit{transform:scaleX(-1) translateX(25px) rotate(-12deg)}
.hud{display:grid;grid-template-columns:1fr 65px 1fr;align-items:center;gap:8px}
.health{height:20px;background:#555;border:2px solid white;border-radius:6px;overflow:hidden}
.fill{height:100%;width:100%;background:#39d66c;transition:width .2s}
#enemyHealth{background:#f14e50}
#timer{font-size:25px;font-weight:bold}
#controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:15px auto}
#controls button{padding:18px 3px;font-size:13px;background:#303a64;color:white;border:1px solid #7884b8}
#controls button.special{background:#a82f56}
#message{min-height:28px;color:#ffd43b;font-weight:bold}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}#arena{height:350px}}
</style>
</head>
<body>
<header>
<h1>🇨🇴 COMBATE COLOMBIA</h1>
<p>¡Que comience el combate!</p>
</header>

<section id="selection" class="screen">
<h2>ELIGE TU LUCHADOR</h2>
<p>Selecciona tu personaje para comenzar.</p>
<div class="grid" id="fighters"></div>
<br>
<button onclick="startGame()">⚔️ COMENZAR COMBATE</button>
</section>

<section id="game" class="screen hidden">
<div class="hud">
<div><small id="playerName">JUGADOR</small><div class="health"><div class="fill" id="playerHealth"></div></div></div>
<div id="timer">60</div>
<div><small id="enemyName">RIVAL</small><div class="health"><div class="fill" id="enemyHealth"></div></div></div>
</div>
<div id="arena">
<div id="playerSprite" class="fighter-sprite">🧔</div>
<div id="enemySprite" class="fighter-sprite">👨</div>
</div>
<div id="message">¡Prepárate para luchar!</div>
<div id="controls">
<button onclick="attack('punch')">👊<br>GOLPE</button>
<button onclick="attack('kick')">🦵<br>PATADA</button>
<button onclick="attack('special')" class="special">⚡<br>ESPECIAL</button>
<button onclick="defend()">🛡️<br>DEFENDER</button>
</div>
<button onclick="backToMenu()">VOLVER AL MENÚ</button>
</section>

<script>
const characters=[
{name:"Gustavo Petro",emoji:"🧔",power:8},
{name:"Álvaro Uribe",emoji:"👨🏻",power:9},
{name:"Iván Duque",emoji:"👨🏼",power:7},
{name:"Juan Manuel Santos",emoji:"👨🏻‍🦳",power:7},
{name:"Iván Cepeda",emoji:"👨🏻‍🦲",power:8},
{name:"Paloma Valencia",emoji:"👩🏼",power:8},
{name:"Claudia López",emoji:"👩🏻",power:8},
{name:"Carlos Fernando Galán",emoji:"👨🏻‍🦱",power:7},
{name:"Federico Gutiérrez",emoji:"👨🏻‍💼",power:8},
{name:"Abelardo de la Espriella",emoji:"🕴️",power:9}
];
let chosen=0,player=100,enemy=100,time=60,interval=null,guard=false,busy=false;
const $=id=>document.getElementById(id);

characters.forEach((c,i)=>{
let d=document.createElement("div");
d.className="fighter"+(i===0?" selected":"");
d.innerHTML=`<span class="avatar">${c.emoji}</span><strong>${c.name}</strong><small>Fuerza: ${c.power}/10</small>`;
d.onclick=()=>{
chosen=i;
document.querySelectorAll(".fighter").forEach(x=>x.classList.remove("selected"));
d.classList.add("selected");
};
$("fighters").appendChild(d);
});

function startGame(){
player=100;enemy=100;time=60;guard=false;busy=false;
$("selection").classList.add("hidden");
$("game").classList.remove("hidden");
$("playerName").textContent=characters[chosen].name;
$("enemyName").textContent=characters[(chosen+1)%10].name;
$("playerSprite").textContent=characters[chosen].emoji;
$("enemySprite").textContent=characters[(chosen+1)%10].emoji;
update();
$("message").textContent="¡A LUCHAR!";
clearInterval(interval);
interval=setInterval(()=>{
time--;
$("timer").textContent=time;
if(time<=0)finish();
else if(Math.random()<.45)enemyAttack();
},1000);
}
function update(){
$("playerHealth").style.width=Math.max(0,player)+"%";
$("enemyHealth").style.width=Math.max(0,enemy)+"%";
}
function animate(id){
let el=$(id);
el.classList.add("hit");
setTimeout(()=>el.classList.remove("hit"),180);
}
function attack(type){
if(busy||!interval||time<=0)return;
busy=true;
let damage=type==="punch"?8:type==="kick"?13:22;
if(type==="special"&&Math.random()<.25)damage=10;
enemy=Math.max(0,enemy-damage);
animate("playerSprite");
$("message").textContent=(type==="special"?"⚡ ¡PODER ESPECIAL! ":type==="kick"?"🦵 ¡PATADA! ":"👊 ¡GOLPE! ")+ "-"+damage;
update();
if(enemy<=0){finish();return}
setTimeout(()=>{busy=false},350);
}
function defend(){
if(!interval||time<=0)return;
guard=true;
$("message").textContent="🛡️ ¡DEFENSA ACTIVADA!";
setTimeout(()=>guard=false,1300);
}
function enemyAttack(){
if(enemy<=0||player<=0)return;
let damage=guard?3:Math.floor(Math.random()*8)+4;
player=Math.max(0,player-damage);
animate("enemySprite");
$("message").textContent="¡El rival ataca! -"+damage;
update();
if(player<=0)finish();
}
function finish(){
clearInterval(interval);interval=null;busy=false;
$("message").textContent=player>enemy?"🏆 ¡VICTORIA!":player<enemy?"💥 ¡DERROTA!":"🤝 ¡EMPATE!";
}
function backToMenu(){
clearInterval(interval);interval=null;
$("game").classList.add("hidden");
$("selection").classList.remove("hidden");
}
</script>
</body>
</html>
